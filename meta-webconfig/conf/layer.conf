# SoCcentric WebConfig — Yocto layer (spec §5 named this meta-soccentric-
# webconfig; the on-disk directory is meta-webconfig — docs updated to match).
#
# Adds the on-device WebConfig daemon, its static frontend, schema files, and
# per-platform board manifest to any Yocto image. All OS customization lives in
# this meta layer — upstream Yocto/BSP layers are never patched (global §1).
#
# Add to your image via:
#   IMAGE_INSTALL:append = " webconfigd webconfig-static webconfig-schemas"
# and ship a platform board-manifest (see webconfig-manifest recipe / hook).
#
# This layer did not exist in Arches-Configuration until this commit — every
# other project's Configuration leaf already has one; Arches-OS's own
# CLAUDE.md and Task.md D-09 both describe this layer as already wired in,
# which was never true (Task.md D-09 itself flags the mismatch). Authored
# fresh from the fleet's shared template (see e.g. Orion-Configuration),
# adapted for Arches-OS's actual toolchain: kirkstone (not scarthgap), and
# webconfigd.bb inherits cargo_bin (meta-rust-bin), not cargo — see that
# recipe's own comment and kas/common.yaml's PREFERRED_VERSION pins.

# We only append; this layer never overrides core/BSP classes.
BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

# This layer depends on the core + rust/cargo classes. Arches-OS's poky is
# kirkstone, which has no built-in cargo.bbclass tied to oe-core the way
# scarthgap+ does — meta-rust-bin (already in Arches-OS's kas layer set)
# supplies cargo_bin.bbclass and the prebuilt toolchain webconfigd.bb uses
# instead.
LAYERSERIES_COMPAT_soccentric-webconfig = "kirkstone scarthgap styhead walnascar"

LAYERDEPENDS_soccentric-webconfig = "core"

# WebConfig ships for these machines by default (spec §3: 6 platforms). Other
# machines must provide a board-manifest via the webconfig-manifest bbappend.
LAYERSERIES_COREVERSION_soccentric-webconfig = "14"
