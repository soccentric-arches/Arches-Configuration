[package]
name = "webconfig-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Canonical config store, schema engine, and system appliers for SoCcentric WebConfig (HTTP-free, hardware-free testable)."

[lib]
